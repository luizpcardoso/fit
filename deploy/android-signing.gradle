// Credentials are passed by the local build process, never committed to Gradle properties.
android {
    signingConfigs {
        fitRelease {
            storeFile file(System.getenv('FIT_ANDROID_KEYSTORE'))
            storePassword System.getenv('FIT_ANDROID_STORE_PASSWORD')
            keyAlias System.getenv('FIT_ANDROID_KEY_ALIAS')
            keyPassword System.getenv('FIT_ANDROID_KEY_PASSWORD')
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.fitRelease }
    }
}
