name: fit_cloudflare_tunnel

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Configure the private Cloudflare Tunnel token}
    command: ["tunnel", "--no-autoupdate", "run"]
    networks: [public_proxy]
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  public_proxy:
    external: true
    name: fit_web_preview_default
