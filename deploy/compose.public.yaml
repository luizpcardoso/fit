# Retain the existing preview project's identity while enabling the complete application.
name: fit_web_preview
services:
  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./public.nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../downloads:/srv/downloads:ro
      - ./data/updates:/srv/updates:ro
    networks: [default, backend]
    ports:
      - "127.0.0.1:8080:80"
    mem_limit: 128m
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=1777
      - /var/run:size=1m,mode=1777
      - /tmp:size=16m,mode=1777
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Configure private ngrok credentials}
    command:
      - http
      - http://web:80
      - --url=https://rasheeda-disillusive-riotously.ngrok-free.dev
      - --pooling-enabled
      - --inspect=false
      - --log=stdout
    mem_limit: 256m
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  backend:
    external: true
    name: fit_server_default
