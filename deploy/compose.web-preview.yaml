name: fit_web_preview
services:
  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./web-preview/site:/srv/web:ro
      - ./web-preview.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"
    mem_limit: 128m
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    depends_on: [web]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Configure private ngrok credentials}
    command:
      - http
      - http://web:80
      - --url=https://rasheeda-disillusive-riotously.ngrok-free.dev
      - --pooling-enabled
      - --inspect=false
      - --log=stdout
    mem_limit: 256m
