server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 16m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    # Only the internal Docker gateway can supply the final forwarded address.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;
    access_log off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $fit_backend http://api:3333;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /downloads/fit.apk {
        alias /srv/downloads/fit.apk;
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="Fit.apk"';
        add_header Cache-Control no-store;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /downloads/fit.apk.sha256 {
        alias /srv/downloads/fit.apk.sha256;
        default_type text/plain;
        add_header Cache-Control no-store;
    }
    location = /downloads/release.json {
        alias /srv/downloads/release.json;
        default_type application/json;
        add_header Cache-Control no-store;
        add_header X-Content-Type-Options nosniff always;
    }
    location /docs { return 404; }
    location ~ "^/updates/assets/([a-f0-9]{64}\.[a-z0-9]{1,8})$" {
        alias /srv/updates/assets/$1;
        limit_except GET { deny all; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location /updates/assets/ { return 404; }
    location ~ /\. { return 404; }
    location / {
        proxy_pass $fit_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
