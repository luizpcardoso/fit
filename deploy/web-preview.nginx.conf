server {
    listen 80;
    server_name _;
    root /srv/web;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location = / { try_files /index.html =404; }
    location = /theme.css { try_files $uri =404; }
    location /home/ { try_files $uri =404; }
    location = /portal { return 302 /portal/; }
    location /portal/ { index index.html; try_files $uri $uri/ =404; }
    # No proxy: the preview cannot forward login, data or administrative API calls.
    location / { return 404; }
}
